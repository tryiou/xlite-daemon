name: build-all

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.draft == false

      - name: Setup GraalVM JDK 21 via SDKMAN (FOR LOCAL TESTING WITH ACT)
        shell: bash
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install java 21.0.2-graalce
          echo "JAVA_HOME=$HOME/.sdkman/candidates/java/21.0.2-graalce" >> $GITHUB_ENV
          echo "$HOME/.sdkman/candidates/java/21.0.2-graalce/bin" >> $GITHUB_PATH
          
      # - uses: graalvm/setup-graalvm@v1
      #   with:
      #     version: '21'
      #     java-version: '21'
      #     components: native-image

      - name: Verify Java Installation
        run: |
          java -version
          native-image --version          

      - run: chmod +x gradlew
      - run: ./gradlew nativeCompile --info
      - run: chmod +x build/native/nativeCompile/xlite-daemon
      - run: mv build/native/nativeCompile/xlite-daemon build/native/nativeCompile/xlite-daemon-linux64

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            build/native/nativeCompile/xlite-daemon-linux64

      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: XLite Daemon ${{ github.ref_name}}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            build/native/nativeCompile/xlite-daemon-linux64

  build_mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.draft == false

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '21'
          java-version: '21'
          components: native-image

      - name: Verify Java Installation
        run: |
          java -version
          native-image --version      

      - run: chmod +x gradlew
      - run: ./gradlew nativeCompile --info
      - run: chmod +x build/native/nativeCompile/xlite-daemon
      - run: mv build/native/nativeCompile/xlite-daemon build/native/nativeCompile/xlite-daemon-osx64

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-mac
          path: |
            build/native/nativeCompile/xlite-daemon-osx64

      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: XLite Daemon ${{ github.ref_name}}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            build/native/nativeCompile/xlite-daemon-osx64

  build_win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.draft == false

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '21'
          java-version: '21'
          components: native-image

      - name: Verify Java Installation
        run: |
          java -version
          native-image --version

      - name: Install Windows SDK and Visual Studio Build Tools
        run: |
          choco install -y windows-sdk-10.0
          choco install -y visualstudio2022-workload-vctools

      - name: Setup Visual Studio Build Environment
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          echo "Visual Studio environment loaded"

      - name: Setup Windows SDK Environment
        run: |
          $sdkVersion = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdkBinPath = "$($sdkVersion.FullName)\x64"
          $sdkIncludePath = "$($sdkVersion.Parent.FullName)\include\$($sdkVersion.Name)\shared;$($sdkVersion.Parent.FullName)\include\$($sdkVersion.Name)\um;$($sdkVersion.Parent.FullName)\include\$($sdkVersion.Name)\ucrt"
          $sdkLibPath = "$($sdkVersion.Parent.FullName)\lib\$($sdkVersion.Name)\um\x64"
          
          echo "SDK_BIN_PATH=$sdkBinPath" >> $env:GITHUB_ENV
          echo "SDK_INCLUDE_PATH=$sdkIncludePath" >> $env:GITHUB_ENV
          echo "SDK_LIB_PATH=$sdkLibPath" >> $env:GITHUB_ENV
          
          $env:PATH = "$sdkBinPath;$env:PATH"
          $env:INCLUDE = "$sdkIncludePath;$env:INCLUDE"
          $env:LIB = "$sdkLibPath;$env:LIB"

      - run: ./gradlew.bat nativeCompile --info
      - run: ren build\native\nativeCompile\xlite-daemon.exe xlite-daemon-win64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-win
          path: |
            build\native\nativeCompile\xlite-daemon-win64.exe

      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: XLite Daemon ${{ github.ref_name}}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            build\native\nativeCompile\xlite-daemon-win64.exe
